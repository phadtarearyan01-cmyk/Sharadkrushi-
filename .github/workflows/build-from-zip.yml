name: Build App From ZIP

on:
  push:
    branches:
      - main
    paths:
      - "**.zip"
      - ".github/workflows/build-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf app
          mkdir -p app

          unzip -q "${{ steps.zip.outputs.zip_file }}" -d app

          echo "ZIP extracted successfully."
          find app -maxdepth 2 -type f | head -100

      - name: Detect project root
        shell: bash
        run: |
          if [ -f "app/package.json" ]; then
            echo "PROJECT_DIR=app" >> "$GITHUB_ENV"
          else
            PACKAGE_JSON=$(find app -name package.json -type f | head -n 1)

            if [ -z "$PACKAGE_JSON" ]; then
              echo "ERROR: package.json not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE_JSON")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Show detected project
        run: |
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          cat package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "${{ env.PROJECT_DIR }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Verify dist
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Build successful."
          echo "dist contents:"
          find dist -maxdepth 2 -type f | head -100

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ${{ env.PROJECT_DIR }}/dist
