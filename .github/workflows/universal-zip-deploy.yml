name: Universal ZIP Build and Cloudflare Deploy

on:
  push:
    branches:
      - main
    paths:
      - "**/*.zip"
      - ".github/workflows/universal-zip-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Extract → Build → Verify → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. Checkout GitHub repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================
      # 2. Find ZIP
      # ==========================================

      - name: Find application ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: No ZIP file found."
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 3. Prepare extraction folder
      # ==========================================

      - name: Prepare application directory
        run: |
          rm -rf app
          mkdir -p app


      # ==========================================
      # 4. Extract ZIP
      # ==========================================

      - name: Extract application ZIP
        shell: bash
        run: |
          set -e

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d app

          echo "✅ ZIP extracted."


      # ==========================================
      # 5. Find package.json
      # ==========================================

      - name: Detect project root
        id: detect_project
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find app \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "❌ ERROR: package.json not found."
            echo ""
            echo "Files found:"
            find app -maxdepth 3 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "✅ Project detected:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 6. Setup Node
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20


      # ==========================================
      # 7. Detect package manager
      # ==========================================

      - name: Detect package manager
        id: package_manager
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |

          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "✅ Using pnpm"

          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "✅ Using yarn"

          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "✅ Using npm"

          else
            echo "manager=npm-install" >> "$GITHUB_OUTPUT"
            echo "⚠️ No lock file found. Using npm install."
          fi


      # ==========================================
      # 8. Enable Corepack
      # ==========================================

      - name: Enable Corepack
        run: |
          corepack enable || true


      # ==========================================
      # 9. Install dependencies
      # ==========================================

      - name: Install dependencies
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          MANAGER="${{ steps.package_manager.outputs.manager }}"

          if [ "$MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile

          elif [ "$MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile

          elif [ "$MANAGER" = "npm" ]; then
            npm ci

          else
            npm install
          fi


      # ==========================================
      # 10. Show project scripts
      # ==========================================

      - name: Inspect package scripts
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          node -e "
            const p=require('./package.json');
            console.log('Project:', p.name || 'unknown');
            console.log('Scripts:', p.scripts || {});
          "


      # ==========================================
      # 11. Build
      # ==========================================

      - name: Build application
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          MANAGER="${{ steps.package_manager.outputs.manager }}"

          if [ "$MANAGER" = "pnpm" ]; then
            pnpm run build

          elif [ "$MANAGER" = "yarn" ]; then
            yarn build

          else
            npm run build
          fi


      # ==========================================
      # 12. Verify dist
      # ==========================================

      - name: Verify production build
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist directory was not created."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "✅ BUILD SUCCESSFUL"
          echo "======================================"

          du -sh dist

          echo ""
          echo "Production files:"
          find dist -maxdepth 2 -type f | head -100


      # ==========================================
      # 13. Save dist
      # ==========================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ${{ steps.detect_project.outputs.project_dir }}/dist
          if-no-files-found: error


      # ==========================================
      # 14. Check Cloudflare configuration
      # ==========================================

      - name: Detect Cloudflare configuration
        id: cloudflare_config
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |

          if [ -f "wrangler.toml" ]; then
            echo "config=wrangler.toml" >> "$GITHUB_OUTPUT"
            echo "✅ Found wrangler.toml"

          elif [ -f "wrangler.json" ]; then
            echo "config=wrangler.json" >> "$GITHUB_OUTPUT"
            echo "✅ Found wrangler.json"

          elif [ -f "wrangler.jsonc" ]; then
            echo "config=wrangler.jsonc" >> "$GITHUB_OUTPUT"
            echo "✅ Found wrangler.jsonc"

          else
            echo "config=none" >> "$GITHUB_OUTPUT"
            echo "❌ No Wrangler configuration found."
          fi


      # ==========================================
      # 15. Verify Cloudflare secrets
      # ==========================================

      - name: Verify Cloudflare credentials
        if: steps.cloudflare_config.outputs.config != 'none'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |

          if [ -z "$CF_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is missing."
            echo ""
            echo "Go to:"
            echo "GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          if [ -z "$CF_ACCOUNT" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is missing."
            echo ""
            echo "Go to:"
            echo "GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "✅ Cloudflare credentials detected."


      # ==========================================
      # 16. Deploy to Cloudflare
      # ==========================================

      - name: Build and Deploy to Cloudflare
        if: steps.cloudflare_config.outputs.config != 'none'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ steps.detect_project.outputs.project_dir }}
          command: deploy


      # ==========================================
      # 17. Finished
      # ==========================================

      - name: Deployment complete
        if: success()
        run: |
          echo ""
          echo "======================================"
          echo "🚀 DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Your Cloudflare deployment has completed."
