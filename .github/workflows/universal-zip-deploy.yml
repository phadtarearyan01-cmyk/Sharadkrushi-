name: Universal ZIP Build and Cloudflare Deploy

on:
  push:
    branches:
      - main

    paths:
      - "**/*.zip"
      - ".github/workflows/universal-zip-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Extract → Build → Verify → Deploy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Find latest ZIP
      # --------------------------------------------------

      - name: Find application ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No application ZIP found."
            exit 1
          fi

          echo "Application ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 3. Clean previous extraction
      # --------------------------------------------------

      - name: Prepare application directory
        run: |
          rm -rf app
          mkdir -p app


      # --------------------------------------------------
      # 4. Extract ZIP
      # --------------------------------------------------

      - name: Extract application ZIP
        shell: bash
        run: |
          set -e

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d app

          echo "ZIP extracted successfully."


      # --------------------------------------------------
      # 5. Find package.json automatically
      # --------------------------------------------------

      - name: Detect project root
        id: detect_project
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find app \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            echo ""
            echo "Files inside ZIP:"
            find app -maxdepth 3 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "Detected project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 6. Detect Node version
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # --------------------------------------------------
      # 7. Detect package manager
      # --------------------------------------------------

      - name: Detect package manager
        id: package_manager
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"

          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"

          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"

          else
            echo "manager=npm-install" >> "$GITHUB_OUTPUT"
          fi


      # --------------------------------------------------
      # 8. Enable package managers
      # --------------------------------------------------

      - name: Enable Corepack
        run: |
          corepack enable || true


      # --------------------------------------------------
      # 9. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MANAGER="${{ steps.package_manager.outputs.manager }}"

          if [ "$MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile

          elif [ "$MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile

          elif [ "$MANAGER" = "npm" ]; then
            npm ci

          else
            npm install
          fi


      # --------------------------------------------------
      # 10. Show available scripts
      # --------------------------------------------------

      - name: Inspect package scripts
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          node -e "
            const p=require('./package.json');
            console.log('Project:', p.name || 'unknown');
            console.log('Scripts:', p.scripts || {});
          "


      # --------------------------------------------------
      # 11. Build application
      # --------------------------------------------------

      - name: Build application
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MANAGER="${{ steps.package_manager.outputs.manager }}"

          if [ "$MANAGER" = "pnpm" ]; then
            pnpm run build

          elif [ "$MANAGER" = "yarn" ]; then
            yarn build

          else
            npm run build
          fi


      # --------------------------------------------------
      # 12. Verify build output
      # --------------------------------------------------

      - name: Verify production build
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "BUILD SUCCESSFUL"
          echo "================================"
          echo ""

          du -sh dist

          echo ""
          echo "Production files:"
          find dist -maxdepth 2 -type f | head -100


      # --------------------------------------------------
      # 13. Upload dist as GitHub artifact
      # --------------------------------------------------

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ${{ steps.detect_project.outputs.project_dir }}/dist
          if-no-files-found: error


      # --------------------------------------------------
      # 14. Check Cloudflare configuration
      # --------------------------------------------------

      - name: Detect Cloudflare configuration
        id: cloudflare
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "wrangler.toml" ]; then
            echo "wrangler_config=wrangler.toml" >> "$GITHUB_OUTPUT"
            echo "Cloudflare configuration detected: wrangler.toml"

          elif [ -f "wrangler.json" ]; then
            echo "wrangler_config=wrangler.json" >> "$GITHUB_OUTPUT"
            echo "Cloudflare configuration detected: wrangler.json"

          elif [ -f "wrangler.jsonc" ]; then
            echo "wrangler_config=wrangler.jsonc" >> "$GITHUB_OUTPUT"
            echo "Cloudflare configuration detected: wrangler.jsonc"

          else
            echo "wrangler_config=none" >> "$GITHUB_OUTPUT"
            echo "No Wrangler configuration found."
          fi


      # --------------------------------------------------
      # 15. Deploy to Cloudflare Workers
      # --------------------------------------------------

      - name: Deploy to Cloudflare
        if: steps.cloudflare.outputs.wrangler_config != 'none'
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          npx wrangler deploy
